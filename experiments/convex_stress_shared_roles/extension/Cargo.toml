[package]
name = "convex-stress-shared-role-extension"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
convex-stress-shared-roles = { path = ".." }
convex-stress-coverage-extension = { path = "../../convex_stress_coverage_extension" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.11.1"

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

[package]
name = "convex-stress-count-gates-compare"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
convex-stress-count-gates = { path = "../convex_stress_count_gates" }
convex-stress-context-mixture-compare = { path = "../convex_stress_context_mixture_compare" }
convex-stress-relabel = { path = "../convex_stress_relabel" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.11.1"

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

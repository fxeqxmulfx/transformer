[workspace]
resolver = "2"
members = ["alm-compile", "alm-hull", "alm-margin", "alm-model", "alm-schedule", "alm-vm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
good_lp = { version = "1.15", default-features = false, features = ["highs"] }

# `transformer.cpp` is one translation unit, so everything in it inlines; the
# port is five crates, and without link-time optimization the hot loop pays a
# call across every crate boundary it crosses.  Worth 9 % of a run and nothing
# at build time that HiGHS was not already costing.
[profile.release]
lto = "fat"
codegen-units = 1

[package]
name = "convex-stress-spectral"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
convex-stress-minibatch = { path = "../convex_stress_minibatch" }
num-complex = { version = "=0.4.6", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[profile.release]
lto = "thin"

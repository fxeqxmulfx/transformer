[package]
name = "convex-stress-paired"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
convex-stress-decode = { path = "../convex_stress_decode" }
convex-stress-relabel = { path = "../convex_stress_relabel" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[profile.release]
lto = "thin"

[profile.test]
opt-level = 2

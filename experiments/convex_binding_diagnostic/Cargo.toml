[package]
name = "convex-binding-diagnostic"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
growth = { package = "convex-content-growth", path = "../convex_content_growth" }
hilbert = { package = "convex-hilbert-content", path = "../convex_hilbert_content" }
bilinear = { package = "convex-bilinear-sequence", path = "../convex_bilinear_sequence" }
baseline = { package = "convex-stress-minibatch", path = "../convex_stress_minibatch" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

[project]
name = "gpt-mini"
version = "0.1.0"
description = "GPTMini and TinyShakespeare optimizer benchmarks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["numpy>=2.5.3", "torch==2.14.0"]

[project.scripts]
gpt-mini-benchmark = "gpt_mini.interfaces.cli:main"

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "gpt_mini", "gpt_mini.domain", "gpt_mini.application", "gpt_mini.infrastructure", "gpt_mini.interfaces",
    "gpt_mini.infrastructure.benchmark", "gpt_mini.tests", "gpt_mini.infrastructure.benchmark.tests",
    "gpt_mini.infrastructure.benchmark.optimizer_benchmark", "gpt_mini.infrastructure.benchmark.magma_benchmark",
    "gpt_mini.infrastructure.benchmark.patience_benchmark", "gpt_mini.infrastructure.benchmark.compiled_benchmark",
    "gpt_mini.infrastructure.benchmark.full_compile_benchmark", "gpt_mini.infrastructure.benchmark.amsgrad_extensions_benchmark",
    "gpt_mini.infrastructure.benchmark.tests.optimizer_benchmark", "gpt_mini.infrastructure.benchmark.tests.magma_benchmark",
    "gpt_mini.infrastructure.benchmark.tests.patience_benchmark", "gpt_mini.infrastructure.benchmark.tests.compiled_benchmark",
    "gpt_mini.infrastructure.benchmark.tests.full_compile_benchmark", "gpt_mini.infrastructure.benchmark.tests.amsgrad_extensions_benchmark",
]
package-dir = { gpt_mini = "src", "gpt_mini.tests" = "tests", "gpt_mini.infrastructure.benchmark.tests" = "tests/benchmark" }
include-package-data = false

[tool.setuptools.package-data]
"gpt_mini.tests" = ["fixtures/*.json"]
"gpt_mini.infrastructure.benchmark" = [
    "migration.json", "data/*.txt", "archive/**/*.py", "archive/**/*.lean", "archive/**/*.json",
    "archive/**/*.jsonl", "archive/**/*.md", "archive/**/*.log", "archive/**/*.txt", "archive/**/*.csv",
]

[tool.setuptools.exclude-package-data]
"gpt_mini.infrastructure.benchmark" = ["archive/experiments/runs/*", "archive/experiments/runs/**/*", "archive/**/__pycache__/*"]

name = "transformer"
defaultTargets = ["Transformer"]
# Lake's artifact cache, shared by the agents' worktrees (AGENTS.md, Board): a
# module built in one is linked into the others' .lake/build, not rebuilt.  Every
# `lake` runs with LAKE_ARTIFACT_CACHE=false, or Lake extends the cache to Mathlib.
enableArtifactCache = true
restoreAllArtifacts = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "Transformer"
srcDir = "src"
# Mathlib's minImports linter keeps cumulative per-file state. Process commands
# in source order so an optional all-linters run does not race that state.
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, Elab.async = false }

[[lean_lib]]
name = "PFR"
srcDir = "third_party/Entropy"
roots = ["PFR.ForMathlib.Entropy.Basic"]
globs = ["PFR.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, Elab.async = false }

[[lean_lib]]
name = "Stochastic"
srcDir = "third_party/Stochastic"
roots = ["BrownianMotion.Gaussian.BrownianMotion"]
globs = ["BrownianMotion.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, Elab.async = false }

[[lean_lib]]
name = "RBTree"
srcDir = "third_party/RBTree"
roots = ["RBTree.Depth", "RBTree.Lemmas"]
globs = ["RBTree.+"]
# The copied sources rely on auto-bound implicits (third_party/RBTree/NOTICE).
leanOptions = { Elab.async = false }

[[lean_lib]]
name = "FixedPointTheorems"
srcDir = "third_party/FixedPointTheorems"
roots = ["FixedPointTheorems.brouwer"]
globs = ["FixedPointTheorems.+"]
leanOptions = { autoImplicit = false, Elab.async = false }

[project]
name = "convex-mqar"
version = "0.1.0"
description = "Convex content recall versus a trained RoPE Transformer on MQAR"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["numpy>=2.5.3", "scipy>=1.14", "torch>=2.14.0"]

[project.scripts]
convex-mqar = "convex_mqar.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

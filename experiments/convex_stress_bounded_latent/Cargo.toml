[package]
name = "convex-stress-bounded-latent"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
num-bigint = "=0.4.8"
num-rational = "=0.4.2"
num-traits = "=0.2.19"

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

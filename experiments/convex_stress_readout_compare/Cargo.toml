[package]
name = "convex-stress-readout-compare"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
convex-stress-readout-kernel = { path = "../convex_stress_readout_kernel" }
convex-stress-readout-kernel-cohort = { path = "../convex_stress_readout_kernel/cohort" }
convex-stress-kernel-compare = { path = "../convex_stress_kernel_compare" }
convex-stress-quotient-cohort = { path = "../convex_stress_quotient/cohort" }
convex-stress-relabel = { path = "../convex_stress_relabel" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

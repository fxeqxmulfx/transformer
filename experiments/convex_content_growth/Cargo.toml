[package]
name = "convex-content-growth"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
hilbert = { package = "convex-hilbert-content", path = "../convex_hilbert_content" }
retained = { package = "convex-retained-readouts", path = "../convex_retained_readouts" }
readouts = { package = "convex-recurrent-readouts", path = "../convex_recurrent_readouts" }
rotary = { package = "convex-rotary-recurrence", path = "../convex_rotary_recurrence" }
bilinear = { package = "convex-bilinear-sequence", path = "../convex_bilinear_sequence" }
baseline = { package = "convex-stress-minibatch", path = "../convex_stress_minibatch" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

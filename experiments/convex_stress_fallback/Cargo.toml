[package]
name = "convex-stress-fallback"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
convex-stress-causal-pairs = { path = "../convex_stress_causal_pairs" }
convex-stress-counts = { path = "../convex_stress_counts" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

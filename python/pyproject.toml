[project]
name = "lab"
version = "0.1.0"
description = "Transformer experiments composed from swappable blocks, trained eagerly or under CUDA graphs"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "lean-optim",
    "numpy>=2.5.4",
    "torch==2.15.0",
]

[project.scripts]
lab = "lab.interfaces.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

# The requested PyTorch 2.15 runtime uses its PyPI CUDA wheel on the RTX 3050.
[tool.uv.sources]
lean-optim = { path = "../optimizers", editable = true }

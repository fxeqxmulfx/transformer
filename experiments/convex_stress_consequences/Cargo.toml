[package]
name = "convex-stress-consequences"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
convex-stress-modular = { path = "../convex_stress_modular" }
convex-stress-tagged = { path = "../convex_stress_tagged" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

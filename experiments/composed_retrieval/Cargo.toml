[package]
name = "composed-retrieval"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
dense-forward = []

[dependencies]
baseline = { package = "convex-stress-minibatch", path = "../convex_stress_minibatch" }
bilinear = { package = "convex-bilinear-sequence", path = "../convex_bilinear_sequence" }
catalog = { package = "convex-stress-catalog", path = "../convex_stress_catalog" }
learned-retrieval = { path = "../learned_retrieval" }
learned-retrieval-transfer = { path = "../learned_retrieval_transfer" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

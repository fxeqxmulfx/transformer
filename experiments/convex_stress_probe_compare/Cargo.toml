[package]
name = "convex-stress-probe-compare"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
model = { package = "convex-stress-probe-model", path = "../convex_stress_probe_model" }
joint = { package = "convex-stress-compact-latent", path = "../convex_stress_compact_latent" }
probes = { package = "convex-stress-probe-data", path = "../convex_stress_probe_data" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.11.1"

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

[package]
name = "convex-stress-frequency-programs"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
convex-stress-prefix-programs = { path = "../convex_stress_prefix_programs" }
convex-stress-frequency-data = { path = "../convex_stress_frequency_data" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

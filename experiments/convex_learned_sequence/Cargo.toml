[package]
name = "convex-learned-sequence"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
num-bigint = "=0.4.8"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
num-complex = "=0.4.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

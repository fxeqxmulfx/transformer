[package]
name = "convex-stress-fallback-compare"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
convex-stress-fallback = { path = "../convex_stress_fallback" }
convex-stress-causal-pairs-cohort = { path = "../convex_stress_causal_pairs/cohort" }
convex-stress-readout-compare = { path = "../convex_stress_readout_compare" }
convex-stress-quotient-cohort = { path = "../convex_stress_quotient/cohort" }
convex-stress-relabel = { path = "../convex_stress_relabel" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[dev-dependencies]
convex-stress-counts = { path = "../convex_stress_counts" }

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

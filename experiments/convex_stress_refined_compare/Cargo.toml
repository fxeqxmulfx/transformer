[package]
name = "convex-stress-refined-compare"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
convex-stress-refined-quotient = { path = "../convex_stress_refined_quotient" }
convex-stress-refined-quotient-cohort = { path = "../convex_stress_refined_quotient/cohort" }
convex-stress-causal-pairs-cohort = { path = "../convex_stress_causal_pairs/cohort" }
convex-stress-quotient-cohort = { path = "../convex_stress_quotient/cohort" }
convex-stress-relabel = { path = "../convex_stress_relabel" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

[package]
name = "convex-stress-coordinate-programs"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
num-complex = "=0.4.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

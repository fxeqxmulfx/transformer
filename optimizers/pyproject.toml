[project]
name = "lean-optim"
version = "0.1.0"
description = "PyTorch optimizers with an explicit map to Lean recurrence models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]
license = "MIT"
license-files = ["LICENSE"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[package]
name = "phasor-value-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace]

[workspace.metadata.kernite]
name = "wsd_native"

[features]
default = ["tf32-backward", "tiled-transpose", "fused-attention"]
tf32-backward = []
bf16-forward = []
tiled-transpose = []
fused-attention = []
fp32-affine-reference = []
learned-stream-read = []
original-stream-mean = []
bounded-memory-read = []
causal-product-input = []
compact-ffn = []
phase-prefix-read = []
input-phase-read = []
affine-phase-read = []
bilinear-phase-read = []
shared-bilinear-phase = []
scalar-phase-bottleneck = []
prefix-toeplitz = []
tied-toeplitz = []
two-sided-frame = []
triple-transport = []
triple-bipartite = []
triple-lookup-prototypes = []
triple-phase-read = []
triple-lookup-phase = []
triple-peer-phase = []
triple-witness-phase = []
triple-iterated-witness = []
triple-role-witness = []
triple-graph-witness = []
triple-unit-graph = []
triple-shared-graph = []
triple-current-graph = []
triple-pair-classes = []
triple-dense-induction = []
triple-chart-induction = []
triple-typed-lookup = []
triple-normalized-lookup = []
triple-fixed-ten-lookup = []
triple-power-lookup = []
triple-power-lookup-20 = []
triple-power-lookup-40 = []
triple-ordered-lookup = []
triple-varied-depth-lookup = []
study-mixed-depths = []
triple-context-residual = []
fourier-transport = []
reflection-phase-read = []
single-reflection-read = []
associative-reflection-read = []
periodic-reflection-read = []
context-rotation-read = []
crossed-context-rotation = []
householder-memory = []
pair-v2 = []
prefix-xor = []
prefix-xor-cubic = ["prefix-xor"]
prefix-successor = ["prefix-xor"]
prefix-successor-half = ["prefix-successor"]
successor-displacement = ["prefix-successor-half"]
successor-displacement-quarter = ["successor-displacement"]
successor-gain-three-quarters = ["successor-displacement"]
prefix-frequency = ["successor-gain-three-quarters"]
relation-paths = ["successor-gain-three-quarters"]
relation-path-mean = ["relation-paths"]
relation-support = ["relation-path-mean"]
closed-relation = ["successor-gain-three-quarters"]
closed-relation-boost = ["closed-relation"]
single-write-gain = ["closed-relation-boost"]
transition-table = ["single-write-gain"]
inclusive-transitions = ["transition-table"]
successor-hit-gain = ["successor-displacement"]
successor-hit-gain-seven-quarters = ["successor-hit-gain"]
successor-agreement = ["successor-hit-gain"]
successor-bonus = ["successor-displacement"]
transition-count = ["prefix-successor-half"]
prefix-sum = []

[[bin]]
name = "phasor-value-transport"
path = "src/main.rs"
test = false

[dependencies]
arithmetic = { package = "convex-stress-arithmetic-data", path = "../convex_stress_arithmetic_data" }
basis = { package = "convex-stress-basis-data", path = "../convex_stress_basis_data" }
minibatch = { package = "convex-stress-minibatch", path = "../convex_stress_minibatch" }
composed-retrieval = { path = "../composed_retrieval", features = ["chain-data"] }
frequency = { package = "convex-stress-frequency-data", path = "../convex_stress_frequency_data" }
parity = { package = "convex-stress-parity-data", path = "../convex_stress_parity_data" }
probes = { package = "convex-stress-probe-data", path = "../convex_stress_probe_data" }
kernite-cuda = "=0.6.0"
kernite-macros = "=0.6.0"
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.11.1"
source-codec = { package = "diffgpt-mash-native", path = "../../.lake/reproduction/gpt/src/native_transformer/codec" }

[build-dependencies]
serde_json = "=1.0.154"

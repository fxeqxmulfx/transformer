[package]
name = "convex-stress-context-scale-compare"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
convex-stress-context-scale = { path = "../convex_stress_context_scale" }
convex-stress-context-compare = { path = "../convex_stress_context_compare" }
convex-stress-relabel = { path = "../convex_stress_relabel" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.11.1"

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

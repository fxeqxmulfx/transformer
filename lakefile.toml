name = "transformer"
defaultTargets = ["Transformer"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "Transformer"
srcDir = "src"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_lib]]
name = "PFR"
srcDir = "third_party/Entropy"
roots = ["PFR.ForMathlib.Entropy.Basic"]
globs = ["PFR.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_lib]]
name = "Stochastic"
srcDir = "third_party/Stochastic"
roots = ["BrownianMotion.Gaussian.BrownianMotion", "KolmogorovExtension4.KolmogorovExtension"]
globs = ["BrownianMotion.+", "KolmogorovExtension4.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[package]
name = "composed-retrieval"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
dense-forward = []
logodds-depth = ["dense-forward"]
arithmetic-cohort = ["dense-forward", "dep:arithmetic-data"]
output-offsets = ["arithmetic-cohort", "logodds-depth"]
prefix-cohort = ["output-offsets", "dep:synthetic-data"]

[[bin]]
name = "reconcile-arithmetic"
path = "src/bin/reconcile-arithmetic.rs"
required-features = ["arithmetic-cohort"]

[[bin]]
name = "compare-depth"
path = "src/bin/compare-depth.rs"
required-features = ["logodds-depth"]

[[bin]]
name = "compare-output-offsets"
path = "src/bin/compare-output-offsets.rs"
required-features = ["output-offsets"]

[[bin]]
name = "offset-intervals"
path = "src/bin/offset-intervals.rs"
required-features = ["output-offsets"]

[[bin]]
name = "prefix-inventory"
path = "src/bin/prefix-inventory.rs"
required-features = ["prefix-cohort"]

[[bin]]
name = "reconcile-prefix"
path = "src/bin/reconcile-prefix.rs"
required-features = ["prefix-cohort"]

[dependencies]
synthetic-data = { package = "convex-stress-remaining-synthetic-data", path = "../convex_stress_remaining_synthetic_data", optional = true }
arithmetic-data = { package = "convex-stress-arithmetic-data", path = "../convex_stress_arithmetic_data", optional = true }
baseline = { package = "convex-stress-minibatch", path = "../convex_stress_minibatch" }
bilinear = { package = "convex-bilinear-sequence", path = "../convex_bilinear_sequence" }
catalog = { package = "convex-stress-catalog", path = "../convex_stress_catalog" }
learned-retrieval = { path = "../learned_retrieval" }
learned-retrieval-transfer = { path = "../learned_retrieval_transfer" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

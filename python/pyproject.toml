[project]
name = "lab"
version = "0.1.0"
description = "Transformer experiments composed from swappable blocks, trained eagerly or under CUDA graphs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lean-optim",
    "numpy>=2.5.4",
    "torch==2.14.1",
]

[project.scripts]
lab = "lab.interfaces.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

# The PyPI wheel of torch 2.14 is built for CUDA 13, which no longer supports
# Pascal GPUs (compute capability 6.1); the CUDA 12.6 build still does.
[tool.uv.sources]
lean-optim = { path = "../optimizers", editable = true }
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
